name: SAMD actual CODAL core reset and affected callers
on:
  pull_request:
    paths:
      - 'crates/core/src/cpu/cortex_m.rs'
      - 'crates/core/src/tests/scb_reset.rs'
      - 'crates/core/tests/samd_real_core_reset_guest.rs'
      - '.github/workflows/samd-real-core-reset-guest.yml'
permissions:
  contents: read
concurrency:
  group: real-core-reset-${{ github.ref }}
  cancel-in-progress: true
env:
  LABWIRED_RESET_SOURCE: 4ab84c54c1e9d28c6e927458ddebc3da7b753432
  LABWIRED_SERVICES_SOURCE: 932d476344107386d56dfd2d595d74d713780563
  LABWIRED_SPI_SOURCE: 932d476344107386d56dfd2d595d74d713780563
jobs:
  core-reset-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CrispStrobe/codal-samd
          ref: 4ab84c54c1e9d28c6e927458ddebc3da7b753432
          path: owned-reset-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CrispStrobe/codal-samd
          ref: 932d476344107386d56dfd2d595d74d713780563
          path: owned-prior-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Build reset and all affected unchanged caller images
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          arm-none-eabi-g++ --version
          dpkg-query -W gcc-arm-none-eabi
          names=(positive closed-switch clock-irq-disable clock-disable long-gap heap-alignment public-heap public-heap-oom)
          for mode in $(seq 0 19); do
            git clone --no-checkout https://github.com/lancaster-university/codal-core.git "owned-reset-core-$mode"
            git -C "owned-reset-core-$mode" checkout --detach 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
            source=owned-prior-source
            output="$RUNNER_TEMP/old-$mode"
            if test "$mode" -lt 8; then output="$RUNNER_TEMP/runtime-services/${names[$mode]}"; fi
            if test "$mode" = 19; then source=owned-reset-source; output="$RUNNER_TEMP/core-reset"; fi
            (cd "$source"; bash runtime-services/build.sh "../owned-reset-core-$mode" "$output" "$mode")
          done
      - name: Nonvacuous reset controls and source-reviewed CPU reset controls
        run: |
          cargo test --release --locked -p labwired-core --test samd_real_core_reset_guest -- --nocapture
          cargo test --release --locked -p labwired-core --lib scb_reset_tests -- --nocapture
      - name: Execute new reset and all affected earlier callers in both profiles
        run: |
          set -o pipefail
          reset_failures=0
          for profile in default event-scheduler; do
            feature_args=()
            if test "$profile" = event-scheduler; then feature_args=(--features event-scheduler); fi
            echo "SAMD_CORE_RESET_AFFECTED_BEGIN profile=$profile"
            export LABWIRED_SERVICES_FIXTURE_DIR="$RUNNER_TEMP/runtime-services"
            if ! cargo test --release --locked -p labwired-core "${feature_args[@]}" --test samd_real_services_guest -- --ignored --nocapture 2>&1 | tee "core-reset-services-$profile.log"; then reset_failures=$((reset_failures+1)); fi
            for mode in $(seq 8 18); do
              case "$mode" in
                8) fixture=samd_real_spi_guest ;;
                9) fixture=samd_real_spi_cancel_guest ;;
                10|11) fixture=samd_real_spi_timeout_guest ;;
                12) fixture=samd_real_spi_error_guest ;;
                13) fixture=samd_real_spi_stale_guest ;;
                14) fixture=samd_real_spi_lease_guest ;;
                15|16|17|18) fixture=samd_real_spi_lifetime_guest ;;
              esac
              export LABWIRED_SPI_MODE="$mode"
              export LABWIRED_SPI_FIXTURE_DIR="$RUNNER_TEMP/old-$mode"
              if ! cargo test --release --locked -p labwired-core "${feature_args[@]}" --test "$fixture" -- --ignored --nocapture 2>&1 | tee "core-reset-old-$mode-$profile.log"; then reset_failures=$((reset_failures+1)); fi
            done
            export LABWIRED_RESET_FIXTURE_DIR="$RUNNER_TEMP/core-reset"
            if ! cargo test --release --locked -p labwired-core "${feature_args[@]}" --test samd_real_core_reset_guest -- --ignored --nocapture 2>&1 | tee "core-reset-new-$profile.log"; then reset_failures=$((reset_failures+1)); fi
            echo "SAMD_CORE_RESET_AFFECTED_END profile=$profile"
          done
          test "$reset_failures" -eq 0
      - name: Preserve reset and affected source-bound observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actual-codal-core-reset-results
          path: |
            core-reset-*.log
            ${{ runner.temp }}/core-reset/
            ${{ runner.temp }}/runtime-services/
            ${{ runner.temp }}/old-*/
